name: Supabase Günlük Yedekleme

on:
  schedule:
    - cron: '0 21 * * *' # Her gün TSİ 00:00 (UTC 21:00)
  workflow_dispatch: # Manuel tetikleme için

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Set Timestamp
        id: timestamp
        # Türkiye saatiyle daha uyumlu olması için UTC+3 veya doğrudan o anki zamanı çeker.
        # Format: YYYY-MM-DD_HH-MM-SS (Örn: 2026-05-03_21-00-00)
        run: echo "NOW=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV

      - name: Backup Database
        run: |
          export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
          
          # Dosya adını dinamik olarak belirliyoruz
          pg_dump -h aws-1-eu-central-1.pooler.supabase.com \
                  -U postgres.rlhhlbnaecljcegabwak \
                  -p 5432 \
                  -d postgres \
                  --no-password \
                  --no-owner \
                  --no-privileges > backup_${{ env.NOW }}.sql

      - name: Upload Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          # İndirilecek zip dosyasının adı
          name: supabase-backup-${{ env.NOW }}
          # Yüklenecek olan sql dosyasının tam adı
          path: backup_${{ env.NOW }}.sql
          retention-days: 30
