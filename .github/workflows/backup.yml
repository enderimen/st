name: Supabase Günlük Yedekleme

on:
  schedule:
    - cron: '0 21 * * *' # Her gün TSİ 00:00
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 and Rclone
        run: |
          # PostgreSQL 17 istemcisini kur (Sürüm hatası almamak için)
          sudo apt-get update
          sudo apt-get install -y wget gnupg rclone
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Backup Database
        run: |
          export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
          # Panelden aldığın kesinleşmiş bilgiler: aws-1 hostu ve 5432 portu
          pg_dump -h aws-1-eu-central-1.pooler.supabase.com \
                  -U postgres.rlhhlbnaecljcegabwak \
                  -p 5432 \
                  -d postgres \
                  --no-password \
                  --no-owner \
                  --no-privileges > backup_file.sql

      - name: Upload to Google Drive via Rclone
        run: |
          echo "${{ secrets.GDRIVE_JSON_KEY }}" | base64 -d > credentials.json
          
          # 1. Config dosyasını güncelliyoruz
          cat <<EOF > rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = credentials.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          # Kota hatasını aşmak için kritik parametre:
          server_side_across_configs = true
          EOF
          
          # 2. Yükleme komutunu zorluyoruz
          # --drive-upload-cutoff 0: Parçalı yüklemeyi kapatıp doğrudan yükleme yapar (Kota hatasını genellikle böyle aşarız)
          rclone --config rclone.conf copy backup_file.sql gdrive: \
                 --drive-upload-cutoff 0 \
                 --drive-acknowledge-abuse \
                 -v
