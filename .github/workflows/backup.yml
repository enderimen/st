name: Supabase Günlük Yedekleme

on:
  schedule:
    # Her gün Türkiye saati ile 00:00'da (UTC 21:00) çalışır
    - cron: '0 21 * * *'
  workflow_dispatch: # Manuel çalıştırmak için

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Tools
        run: sudo apt-get install -y postgresql-client

      - name: Backup Database
        run: |
          # Şifre (Sadece şifreyi içeren Secret)
          export PGPASSWORD="${{ secrets.DB_PASSWORD }}"

          # Host kısmını tam olarak panelin verdiği 'aws-1-...' ile değiştirdik
          pg_dump -h aws-1-eu-central-1.pooler.supabase.com \
                  -U postgres.rlhhlbnaecljcegabwak \
                  -p 5432 \
                  -d postgres \
                  --no-password \
                  --no-owner \
                  --no-privileges > backup_file.sql

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_JSON_KEY }}
          filename: backup_file.sql
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "false"
