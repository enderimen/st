name: Supabase Günlük Yedekleme

on:
  schedule:
    # Her gün Türkiye saati ile 00:00'da (UTC 21:00) çalışır
    - cron: '0 21 * * *'
  workflow_dispatch: # Manuel çalıştırmak için

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PostgreSQL Tools
        run: sudo apt-get install -y postgresql-client

      - name: Backup Database
        run: |
          pg_dump "postgres://postgres.rlhhlbnaecljcegabwak:${{ secrets.DB_PASSWORD }}@aws-0-eu-central-1.pooler.supabase.com:6543/postgres?sslmode=require" \
                  --no-password \
                  --no-owner \
                  --no-privileges > backup_file.sql

      - name: Upload to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GDRIVE_JSON_KEY }}
          filename: backup_file.sql
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: "false"
